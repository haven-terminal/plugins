name: publish

# Builds every plugin, signs the index, and commits the result here.
#
# Deliberately not on push: this workflow commits to `main`, and one
# that commits to the branch that triggers it is a loop.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-plugins]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::The index is signed, and that needs both GPG_PRIVATE_KEY"
            echo "::error::and GPG_PASSPHRASE on this repository or its organisation."
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          echo "FINGERPRINT=$fpr" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          # Non-interactive: there is no terminal for gpg to ask on.
          echo 'batch' >> "$HOME/.gnupg/gpg.conf"
          echo 'pinentry-mode loopback' >> "$HOME/.gnupg/gpg.conf"
          printf '%s' "$GPG_PASSPHRASE" > "$HOME/.passphrase"
          chmod 600 "$HOME/.passphrase"

      - name: Build and sign
        run: |
          set -eu
          rm -rf build && mkdir build
          # Unsigned first: the passphrase has to reach gpg through a file
          # rather than a prompt, so the signing is done here rather than
          # by passing publish.sh a fingerprint.
          ./publish.sh "$PWD/build"
          gpg --batch --yes --armor --export "$FINGERPRINT" > build/key.asc
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "$HOME/.passphrase" \
              --detach-sign --armor --local-user "$FINGERPRINT" \
              -o build/plugins.yaml.sig build/plugins.yaml
          gpg --verify build/plugins.yaml.sig build/plugins.yaml

      # Checked the way a user will, before anything is committed: a
      # repository that does not verify must never reach `main`.
      - name: Verify it the way a user would
        run: |
          set -eu
          gh release download --repo haven-terminal/Haven \
             --pattern 'haven-*-x86_64-unknown-linux-gnu.tar.gz' --dir dl
          tar -xzf dl/*.tar.gz -C dl
          haven=$(find dl -type f -name haven -perm -u+x | head -1)
          "$haven" plugin repo add "$PWD/build" --key "$FINGERPRINT" \
             --name check --root "$PWD/try"
          "$haven" plugin --root "$PWD/try" search
          listed=$("$haven" plugin --root "$PWD/try" search | grep -cE '^[a-z]' || true)
          if [ "$listed" -lt 1 ]; then
            echo "::error::the signed index lists nothing"
            exit 1
          fi
          echo "$listed plugins verified from the signed index"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit
        run: |
          set -eu
          rm -rf pool plugins.yaml plugins.yaml.sig key.asc
          cp -r build/pool .
          cp build/plugins.yaml build/plugins.yaml.sig build/key.asc .
          rm -rf build try dl
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Publish the plugins"
          git push
