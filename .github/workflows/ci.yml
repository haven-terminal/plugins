name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo build --release --target wasm32-wasip2

      # The tests load the real components into the real runtime, with
      # the real capability checks. `$HAVEN_PLUGINS` points the host's
      # test helper at this workspace instead of the probes in its own
      # repository.
      - name: Run them against the runtime
        working-directory: checks
        env:
          HAVEN_PLUGINS: ${{ github.workspace }}
        run: cargo test
